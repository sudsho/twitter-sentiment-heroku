<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Twitter sentiment</title>
  <style>
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 2em; color: #222; max-width: 900px; }
    h1 { font-weight: 400; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }
    .positive { background: #d3f0d3; color: #226622; }
    .negative { background: #f6d2d2; color: #882222; }
    .neutral  { background: #eee;    color: #555; }
    .tweet { padding: 6px 0; border-bottom: 1px solid #eee; }
    .meta  { color: #888; font-size: 0.85em; }
    table { font-size: 0.95em; }
    th { font-weight: 500; color: #555; }
  </style>
</head>
<body>
  <h1>Live Twitter sentiment</h1>
  <p class="meta">Tracking keywords from <code>configs/default.yaml</code> (or <code>TRACK_KEYWORDS</code> env). Auto-refresh every 5s. Override with <code>?refresh=N</code>.</p>

  <h2>Sentiment summary</h2>
  <div id="summary">loading...</div>

  <h2>Latest tweets</h2>
  <div id="tweets">loading...</div>

  <script src="{{ url_for('static', filename='chart.js') }}"></script>
</body>
</html>
